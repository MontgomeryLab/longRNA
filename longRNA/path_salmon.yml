##############################  SALMON PIPELINE - FILE PATHS  ##############################
#
# This file contains all file paths for the Salmon RNA-seq pipeline.
# Relative and absolute paths are both allowed.
# All relative paths are evaluated relative to this file's directory (longRNA/).
#
# To run the pipeline:
#   1. Edit samples.csv with your sample information
#   2. Edit config_salmon.yml to adjust pipeline parameters
#   3. Run: long salmon
#
######-------------------------------------------------------------------------------------######

##-- Pipeline file locations (relative to this directory) --##
config_file: config_salmon.yml
merged_config_file: processed_config_salmon.yml

##-- Temporary and cache directories --##
tmp_directory: /home/shliu/cwl_tmp           # Temporary execution directory
cache_directory: /home/shliu/cwl_cache_salmon       # Persistent cache directory

##-- Sample CSV file --##
##-- Contains: Forward Reads, Reverse Reads, Sample/Group Name, Replicate Number, Control --##
##-- All FASTQ paths in the CSV are relative to fastq_directory --##
samples_csv: ../fastq/samples_wt.csv

##-- Directory containing FASTQ files (paths in samples.csv are relative to this) --##
fastq_directory: ../fastq/

##-- Transcriptome FASTA file --##
transcriptome:
  class: File
  path: ../reference/c_elegans.PRJNA13758.WS279.transcripts.fa.gz

##-- GTF annotation file --##
gtf_annotation:
  class: File
  path: ../reference/c_elegans.PRJNA13758.WS279.canonical_geneset_no-rRNA.gtf

##-- Gene ID to gene name mapping file (Excel .xlsx format) --##
##-- Expected columns: 'Your Input' (gene ID), 'Public Name' (gene name) --##
geneid2name_file:
  class: File
  path: ../reference/geneid2name.xlsx

##-- Salmon index directory (will be created if it doesn't exist) --##
salmon_index_dir: ../reference/salmon_index

##-- Output directory for results --##
run_directory: ../salmon_results
